# The full gate, run on every push and pull request (docs/development-plan.md §2.2, §5).
name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Gate (compile + test + lint + format)
        run: npm run gate

      - name: Build
        run: npm run build

      - name: Manifest matches appendix C
        run: npm run check:manifest

      - name: Bundle within budget
        run: npm run check:bundle

      # The release package, checked as a release would be (plan §4.7, step
      # 6): `wxt zip` builds again, so the folder uploaded below is the one
      # inside the zip.
      - name: Release package
        run: npm run zip && npm run verify:release

      # The E2E build adds host access to 127.0.0.1 and a trigger hook; the
      # checks above ran on the production build, which must have neither.
      - name: Build for E2E
        run: npm run build:e2e

      # Installs the Chromium build that the pinned @playwright/test expects.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # The production build as a test package, kept only when every check
      # above passed: download it from the run's page, unzip it, and load the
      # folder in chrome://extensions ("Load unpacked"). The E2E build went to
      # its own folder and is not in it.
      - name: Upload the test package
        uses: actions/upload-artifact@v6
        with:
          name: yipie-chrome-${{ github.sha }}
          path: .output/chrome-mv3/
          # The build sits under .output, which the action skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
