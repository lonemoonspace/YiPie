      <h1>一瞥的设计笔记</h1>
      <p>一瞥把当前网页交给你自己配置的模型服务，在页面上的浮动面板里给出可以直接阅读的总结。这样的设计让数据只在浏览器与你的服务之间流动。</p>
      <p>面板是嵌在页面里的扩展框架，页面脚本读不到你在面板里输入的追问，页面的样式也影响不到面板的排版与字号。</p>
      <h2>为什么不常驻</h2>
      <p>扩展只在你点击图标、使用右键菜单或者按下快捷键时注入脚本，因此安装时不需要任何站点权限，也不会在你没有要求的页面里运行。</p>
      <ul>
        <li>安装时零站点权限</li>
        <li>请求不经过中间服务器</li>
      </ul>
    </article>
